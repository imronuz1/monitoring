name: Daily Telegram Family Progress Report

on:
  schedule:
    # Start 15 minutes early because GitHub Actions can delay jobs scheduled on the hour.
    - cron: "45 17 * * *" # 22:45 Uzbekistan time (UTC+5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Send Telegram family report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import datetime
          import time
          import urllib.parse
          import urllib.request

          files = ["data.json", "kid2.json", "kid3.json"]
          group_state_file = "telegram-groups.json"

          # Uzbekistan time: UTC+5. Scheduled runs start a little early and
          # wait until 23:00 so ordinary GitHub Actions scheduling jitter does
          # not turn a 23:00 report into a report after midnight.
          local_now = datetime.datetime.utcnow() + datetime.timedelta(hours=5)
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              report_time = local_now.replace(hour=23, minute=0, second=0, microsecond=0)
              if local_now < report_time:
                  time.sleep((report_time - local_now).total_seconds())
                  local_now = datetime.datetime.utcnow() + datetime.timedelta(hours=5)

          # GitHub Actions may run late.
          # If it runs after midnight but before 06:00,
          # send the report for the previous calendar day.
          if local_now.hour < 6:
              report_date = local_now.date() - datetime.timedelta(days=1)
          else:
              report_date = local_now.date()

          key = report_date.strftime("%Y-%m-%d")

          mood_map = {
              "great": "😄 Отлично",
              "good": "🙂 Хорошо",
              "okay": "😐 Нормально",
              "tough": "😟 Тяжело",
          }

          def stars(pct):
              if pct >= 100:
                  return "★★★"
              if pct >= 66:
                  return "★★☆"
              if pct >= 33:
                  return "★☆☆"
              return "—"

          blocks = []

          for fn in files:
              if not os.path.exists(fn):
                  continue

              with open(fn, "r", encoding="utf-8") as f:
                  data = json.load(f)

              child_name = data.get("settings", {}).get("child_name") or fn
              subjects = data.get("subjects", [])
              day_progress = data.get("progress", {}).get(key, {})
              mood_key = data.get("moods", {}).get(key)
              mood = mood_map.get(mood_key, "—")
              note = data.get("notes", {}).get(key, "").strip()

              total = 0
              lines = []

              for subject in subjects:
                  subject_id = subject.get("id")
                  value = day_progress.get(subject_id, 0)
                  target = max(1, subject.get("target", 1))
                  unit = subject.get("unit", "")
                  subject_name = subject.get("name", "")
                  icon = subject.get("icon", "•")

                  completion = min(1, value / target)
                  total += completion

                  if value >= target:
                      mark = "✅"
                  elif value > 0:
                      mark = "🟡"
                  else:
                      mark = "⬜"

                  lines.append(
                      f"{mark} {icon} {subject_name}: {value}/{target} {unit}"
                  )

              overall = round(total / len(subjects) * 100) if subjects else 0

              block = (
                  f"👤 {child_name}\n"
                  f"😊 Настроение: {mood}\n"
                  f"✅ Прогресс: {overall}%\n"
                  f"⭐ Звёзды: {stars(overall)}\n"
                  + "\n".join(lines)
              )

              if note:
                  block += f"\n📝 Заметка: {note}"

              blocks.append(block)

          if blocks:
              text = (
                  "📊 Ежедневный семейный прогресс\n"
                  f"📅 {key}\n\n"
                  + "\n\n────────────\n\n".join(blocks)
              )
          else:
              text = (
                  "📊 Ежедневный семейный прогресс\n"
                  f"📅 {key}\n\n"
                  "Файлы с данными детей не найдены."
              )

          api_base = (
              f"https://api.telegram.org/"
              f"bot{os.environ['TELEGRAM_BOT_TOKEN']}"
          )

          try:
              with open(group_state_file, "r", encoding="utf-8") as f:
                  group_state = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              group_state = {"last_update_id": 0, "chat_ids": []}

          chat_ids = set(map(str, group_state.get("chat_ids", [])))
          last_update_id = int(group_state.get("last_update_id", 0))
          updates_url = api_base + "/getUpdates?" + urllib.parse.urlencode({
              "offset": last_update_id + 1,
              "allowed_updates": json.dumps(["message", "my_chat_member"]),
          })

          with urllib.request.urlopen(updates_url) as response:
              updates = json.load(response).get("result", [])

          for update in updates:
              last_update_id = max(last_update_id, update.get("update_id", 0))
              membership = update.get("my_chat_member")
              message = update.get("message")
              event = membership or message
              chat = event.get("chat", {}) if event else {}

              if chat.get("type") not in {"group", "supergroup"}:
                  continue

              chat_id = str(chat["id"])
              if membership and membership.get("new_chat_member", {}).get("status") in {"left", "kicked"}:
                  chat_ids.discard(chat_id)
              else:
                  chat_ids.add(chat_id)

          with open(group_state_file, "w", encoding="utf-8") as f:
              json.dump(
                  {"last_update_id": last_update_id, "chat_ids": sorted(chat_ids)},
                  f,
                  indent=2,
              )

          for chat_id in chat_ids:
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": text,
              }).encode("utf-8")

              with urllib.request.urlopen(api_base + "/sendMessage", payload) as response:
                  response.read()

          print(
              f"Report sent for {key}. "
              f"Sent to {len(chat_ids)} group(s) at "
              f"{local_now.strftime('%Y-%m-%d %H:%M')} Uzbekistan time."
          )
          PY

      - name: Save Telegram group list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-groups.json
          git diff --cached --quiet || git commit -m "Track Telegram report groups"
          git push
